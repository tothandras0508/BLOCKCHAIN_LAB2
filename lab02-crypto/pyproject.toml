[project]
name = "crypto-lab"
version = "0.1.0"
description = "Lab 02: secp256k1, ECDSA, BIP-32/39/44 HD wallets, EIP-55 and post-quantum cost (teaching code only)"
requires-python = ">=3.11"
dependencies = ["pycryptodome>=3.20"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crypto_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
